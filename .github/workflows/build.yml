name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Unzip project
        run: unzip -q PhonePad.zip

      - name: Build debug APK
        working-directory: PhonePad
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PhonePad-APK
          path: PhonePad/app/build/outputs/apk/debug/app-debug.apk
